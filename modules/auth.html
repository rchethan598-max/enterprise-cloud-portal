<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Gateway - CloudOps</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    /* Scoped module layouts fitting constraints */
    .c-auth-card {
      max-inline-size: 40ch;
      margin: var(--space-12) auto;
      background: var(--bg-surface);
      padding: var(--space-6);
      border-radius: calc(var(--radius-4) * var(--radius-modifier));
      box-shadow: var(--elevation-4);
    }
    .c-form-group {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      margin-block-end: var(--space-4);
    }
    .c-input {
      padding: calc(var(--space-2) * var(--density-modifier));
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-2);
      background: var(--bg-app);
      color: inherit;
    }
  </style>
</head>
<body>
  <main class="c-auth-card">
    <h2>Secure Gateway</h2>
    <p style="color: var(--text-secondary); margin-block-end: var(--space-4);">MFA-enabled operational cluster access.</p>
    
    <form onsubmit="return false;">
      <div class="c-form-group">
        <label for="email">Identity Email</label>
        <input type="email" id="email" class="c-input" required placeholder="name@domain.com">
      </div>
      <div class="c-form-group">
        <label for="pass">Security Key</label>
        <input type="password" id="pass" class="c-input" required minlength="8">
      </div>
      <button type="submit" style="inline-size: 100%; padding: var(--space-3); background: var(--color-brand); color: #fff; border: none; border-radius: var(--radius-2); font-weight: 700; cursor: pointer;">Initialize Session</button>
    </form>
  </main>
</body>
</html>
